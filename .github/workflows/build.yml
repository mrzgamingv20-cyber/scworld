
name: Build scmod (ArenaCS + TdmCS)

on:
  push:
  workflow_dispatch:

env:
  SC_API_VERSION: "1.9.3.1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: ArenaCS
            needs_cs_mod: "false"
          - mod: TdmCS
            needs_cs_mod: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check mod sources (Root)
        run: |
          set -e
          ls *.cs >/dev/null 2>&1 || {
            echo "::error::No .cs files found in repository root"
            exit 1
          }

          test -f modinfo.json || {
            echo "::error::modinfo.json not found in repository root"
            exit 1
          }

      - name: Collect reference dlls
        run: |
          set -e
          REFS="$GITHUB_WORKSPACE/_refs"
          mkdir -p "$REFS"

          SC=$(find . -type f -iname 'Survivalcraft.dll' \
            -not -path './.git/*' \
            -not -path './_refs/*' \
            | head -n1)

          if [ -n "$SC" ]; then
            cp "$(dirname "$SC")"/*.dll "$REFS/"
            echo "REF_MODE=local" >> "$GITHUB_ENV"
            echo "Using local game DLLs from $(dirname "$SC")"
          else
            echo "REF_MODE=nuget" >> "$GITHUB_ENV"
            echo "Using NuGet Survivalcraft API $SC_API_VERSION"
          fi

          if [ "${{ matrix.needs_cs_mod }}" = "true" ]; then
            for f in ScCsgoKnives.dll ScCsgoTactical.dll; do
              P=$(find . -type f -iname "$f" \
                -not -path './.git/*' \
                -not -path './_refs/*' \
                | head -n1)

              if [ -z "$P" ]; then
                echo "::error::$f not found in repository"
                exit 1
              fi

              cp -n "$P" "$REFS/" || true
            done
          fi

          echo "Reference DLLs:"
          ls -la "$REFS"

      - name: Generate project file
        run: |
          set -e
          mkdir -p _build

          cat > "_build/${{ matrix.mod }}.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Library</OutputType>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <NoWarn>$(NoWarn);CS0618;CS0649;CS0169;CS0414;CS1591;CS8981;NU1701</NoWarn>
              <DebugType>none</DebugType>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$(SrcDir)/*.cs" />
              <GameDll Include="$(RefsDir)/*.dll" />
              <Reference Include="@(GameDll)" Private="false" />
              <!--NUGET-->
            </ItemGroup>
          </Project>
          XML

          if [ "$REF_MODE" = "nuget" ]; then
            sed -i "s#<!--NUGET-->#<PackageReference Include=\"SurvivalcraftAPI.Survivalcraft\" Version=\"$SC_API_VERSION\"><PrivateAssets>all</PrivateAssets></PackageReference>#" "_build/${{ matrix.mod }}.csproj"
          fi

          cat "_build/${{ matrix.mod }}.csproj"

      - name: Build
        run: |
          set -e

          dotnet build "_build/${{ matrix.mod }}.csproj" -c Release \
            -p:AssemblyName=${{ matrix.mod }} \
            -p:SrcDir="$GITHUB_WORKSPACE" \
            -p:RefsDir="$GITHUB_WORKSPACE/_refs" \
            -o _out

      - name: Package .scmod
        run: |
          set -e
          M="${{ matrix.mod }}"

          test -f "_out/$M.dll" || {
            echo "::error::$M.dll not produced"
            exit 1
          }

          test -f "modinfo.json" || {
            echo "::error::modinfo.json missing"
            exit 1
          }

          mkdir -p _pkg
          cp "_out/$M.dll" _pkg/
          cp "modinfo.json" _pkg/

          (cd _pkg && zip -r -9 "../$M.scmod" .)

          echo "Contents of $M.scmod:"
          unzip -l "$M.scmod"

      - name: Upload .scmod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-scmod
          path: ${{ matrix.mod }}.scmod
          if-no-files-found: error
